name: Public qualification report
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  qualification-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -B -m unittest discover -s tests -v
      - run: python -B scripts/qualification_status.py check
